# Spring Boot's BOM manages most library versions (Kotlin, Spring GraphQL, Spring gRPC,
# grpc-java, Testcontainers, Flyway). Only versions outside that BOM, or ones that must
# match it in a non-dependency context (Gradle plugins, protoc artifacts), are pinned here.
# The managed versions were read from the spring-boot-dependencies and spring-grpc-dependencies
# POMs on Maven Central.

[versions]
spring-boot = "4.1.2"
kotlin = "2.3.21"            # matches kotlin.version managed by Spring Boot 4.1.2
protobuf-plugin = "0.10.0"
protoc = "4.36.2"            # matches protobuf-java managed by Spring gRPC 1.1.2
grpc-java = "1.84.1"         # matches grpc-java.version managed by Spring Boot 4.1.2
mockk = "1.14.11"
springmockk = "5.0.1"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
springmockk = { module = "com.ninja-squad:springmockk", version.ref = "springmockk" }

# Gradle plugins, on build-logic's classpath so its convention plugins can apply them.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen-plugin = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
kotlin-noarg-plugin = { module = "org.jetbrains.kotlin:kotlin-noarg", version.ref = "kotlin" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
protobuf-gradle-plugin = { module = "com.google.protobuf:protobuf-gradle-plugin", version.ref = "protobuf-plugin" }
