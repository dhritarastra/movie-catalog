# Serves the single-page app and forwards API traffic to the gateway, so the browser talks to
# one origin. API paths have their own exact locations and never fall back to index.html.
server {
    listen 80;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # A 5 MiB image plus the rest of the multipart request. Above this nginx answers itself,
    # in the same JSON shape the gateway uses, so the app shows a readable error.
    client_max_body_size 6m;
    error_page 413 = @too_large;

    location = /graphql {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Uploads are received in full before being passed on, so the browser's progress bar
        # measures the transfer to nginx; validation and storage follow while the app shows
        # "Processing".
        proxy_read_timeout 60s;
    }

    location ^~ /media/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
    }

    # Build output with content hashes in the file names never changes.
    location ^~ /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Any other path is an app route rendered in the browser. index.html is revalidated so a
    # new deployment is picked up.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri /index.html;
    }

    location @too_large {
        default_type application/json;
        return 413 '{"errors":[{"message":"The image must be at most 5 MB","extensions":{"code":"RESOURCE_EXHAUSTED"}}]}';
    }
}
