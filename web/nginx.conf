# Serves the app and proxies the API, so the browser talks to one origin.
server {
    listen 80;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # A 5 MiB image plus the other multipart parts.
    client_max_body_size 6m;
    error_page 413 = @too_large;

    location = /graphql {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location ^~ /media/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
    }

    location ^~ /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # App routes; index.html is revalidated so a new deployment is picked up.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri /index.html;
    }

    location @too_large {
        default_type application/json;
        return 413 '{"errors":[{"message":"The image must be at most 5 MB","extensions":{"code":"RESOURCE_EXHAUSTED"}}]}';
    }
}
