syntax = "proto3";

package catalog.v1;

import "catalog/v1/movie.proto";
import "catalog/v1/person.proto";

option java_multiple_files = true;
option java_package = "com.moviecatalog.catalog.v1";

service SearchService {
  // Case-insensitive substring match on titles and names. % and _ match literally.
  rpc Search(SearchRequest) returns (SearchResponse);
}

message SearchRequest {
  string query = 1;
  int32 limit = 2;
}

message SearchHit {
  oneof hit {
    Movie movie = 1;
    Person person = 2;
  }
}

// Best match first: exact, then prefix, then anywhere; ties by text, movies first, then id.
message SearchResponse {
  repeated SearchHit hits = 1;
}
