syntax = "proto3";

package catalog.v1;

import "catalog/v1/common.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.moviecatalog.catalog.v1";

// Roles live on Credit, so one person can be both cast and crew.
message Person {
  string id = 1;
  string name = 2;
  optional string bio = 3;
  optional string birth_date = 4;
  int32 version = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message PersonFields {
  string name = 1;
  optional string bio = 2;
  optional string birth_date = 3;
}

service PersonService {
  rpc CreatePerson(CreatePersonRequest) returns (Person);
  rpc GetPerson(GetPersonRequest) returns (Person);
  rpc GetPeopleByIds(GetPeopleByIdsRequest) returns (GetPeopleByIdsResponse);
  rpc ListPeople(ListPeopleRequest) returns (ListPeopleResponse);
  rpc UpdatePerson(UpdatePersonRequest) returns (Person);
  // FAILED_PRECONDITION while the person has credits.
  rpc DeletePerson(DeletePersonRequest) returns (DeletePersonResponse);
}

message CreatePersonRequest {
  PersonFields fields = 1;
}

message GetPersonRequest {
  string id = 1;
}

message GetPeopleByIdsRequest {
  repeated string ids = 1;
}

// Unknown IDs are left out.
message GetPeopleByIdsResponse {
  map<string, Person> people = 1;
}

message ListPeopleRequest {
  PageRequest page = 1;
  // Case-insensitive substring match; blank lists everyone. % and _ match literally.
  string name_contains = 2;
}

message ListPeopleResponse {
  repeated Person people = 1;
  int32 total_count = 2;
}

message UpdatePersonRequest {
  string id = 1;
  int32 expected_version = 2; // >= 1
  PersonFields fields = 3;
}

message DeletePersonRequest {
  string id = 1;
  int32 expected_version = 2; // >= 1
}

message DeletePersonResponse {
  string id = 1;
}
