name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Gradle runs on this JDK; the build's Java 21 toolchain then matches it.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Caches dependencies and validates the committed Gradle wrapper.
      - uses: gradle/actions/setup-gradle@v6

      # Testcontainers uses the runner's Docker daemon for the Postgres-backed tests.
      - run: ./gradlew build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: "**/build/reports/tests/"

  web:
    name: Web lint, type check, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # The generated GraphQL types are committed; fail if they no longer match the gateway schema.
      - name: Check generated GraphQL types are up to date
        run: npm run codegen && git diff --exit-code -- src/lib/graphql/generated

      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

  stack:
    name: Docker images and stack startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: docker compose build

      - name: Start the stack (waits for every health check)
        run: docker compose up -d --wait --wait-timeout 300

      - name: Smoke test through nginx
        run: |
          curl -fsS http://localhost:3000/movies | grep -q '<html'
          curl -fsS http://localhost:3000/graphql -H 'Content-Type: application/json' \
            -d '{"query":"{ movies { totalCount } }"}' | grep -q '"totalCount":0'

      - name: Show logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
