spring:
  application:
    name: catalog-service
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${CATALOG_DB_USER:catalog}
    password: ${CATALOG_DB_PASSWORD:catalog}
    hikari:
      # Fail fast so health reports a lost database within seconds.
      connection-timeout: 5000
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks it.
      ddl-auto: validate
  grpc:
    server:
      port: ${CATALOG_GRPC_PORT:9091}
      health:
        schedule:
          delay: 2s
          period: 5s

catalog:
  paging:
    max-limit: 100
  search:
    max-limit: 50
