spring:
  application:
    name: media-service
  datasource:
    url: ${MEDIA_DB_URL:jdbc:postgresql://localhost:5432/media}
    username: ${MEDIA_DB_USER:media}
    password: ${MEDIA_DB_PASSWORD:media}
    hikari:
      # Fail fast so health reports a lost database within seconds.
      connection-timeout: 5000
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks it.
      ddl-auto: validate
  grpc:
    server:
      port: ${MEDIA_GRPC_PORT:9092}
      health:
        schedule:
          delay: 2s
          period: 5s

media:
  storage-dir: ${MEDIA_STORAGE_DIR:./media-data}
  max-upload-bytes: 5242880 # 5 MiB
  max-width: 8000
  max-height: 8000
  thumbnail-width: 400
  download-chunk-bytes: 65536 # 64 KiB
