spring:
  application:
    name: media-service
  datasource:
    url: ${MEDIA_DB_URL:jdbc:postgresql://localhost:5432/media}
    username: ${MEDIA_DB_USER:media}
    password: ${MEDIA_DB_PASSWORD:media}
    hikari:
      # Milliseconds. Fail fast when the database is unreachable, so health reports it
      # within seconds rather than after the 30s default.
      connection-timeout: 5000
  grpc:
    server:
      port: ${MEDIA_GRPC_PORT:9092}
      health:
        schedule:
          # Refresh the gRPC health status from application health (database included).
          delay: 2s
          period: 5s
