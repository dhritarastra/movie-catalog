name: movie-catalog

# Run with `docker compose up --build`, then open http://localhost:3000.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Used by the init script to create one database per service.
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog}
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD:-media}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Check over TCP: during first setup the server only listens on the socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalog-service:
    build:
      # Repository root, so the build can reach build-logic and proto.
      context: .
      dockerfile: services/catalog-service/Dockerfile
    environment:
      CATALOG_DB_URL: jdbc:postgresql://postgres:5432/catalog
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:9091"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10

  media-service:
    build:
      # Repository root, so the build can reach build-logic and proto.
      context: .
      dockerfile: services/media-service/Dockerfile
    environment:
      MEDIA_DB_URL: jdbc:postgresql://postgres:5432/media
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD:-media}
      MEDIA_STORAGE_DIR: /var/lib/media
    volumes:
      - media-data:/var/lib/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:9092"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10

  gateway:
    build:
      # Repository root, so the build can reach build-logic and proto.
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      CATALOG_GRPC_TARGET: catalog-service:9091
      MEDIA_GRPC_TARGET: media-service:9092
    depends_on:
      catalog-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10

  web:
    build: web
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Demo data: `docker compose run --rm seed` on an empty catalog.
  seed:
    image: node:22-alpine
    profiles: ["seed"]
    command: ["node", "/seed/run.ts"]
    environment:
      SEED_URL: http://web/graphql
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
    volumes:
      - ./web/seed:/seed:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres-data:
  media-data:
