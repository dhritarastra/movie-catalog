name: movie-catalog

# Day 1: Postgres only. The services, nginx and web app are added as their Dockerfiles land
# (docs/PLAN.md §10). One Postgres container hosts two databases, one per service.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Read by the init script to create one role and database per service.
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog}
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD:-media}
    ports:
      # This machine only: these are development credentials.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Check over TCP. During first-time setup the init script runs on a temporary server
      # that only listens on the Unix socket, so a socket check could pass before the
      # catalog and media databases exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
